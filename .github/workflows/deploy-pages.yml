name: Publicar Nördhub no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Preparar gerador de favicons
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=10,<12" "CairoSVG>=2.7,<3"
      - name: Validar e construir
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
        run: npm run build
      - name: Gerar favicon PNG e ICO do emblema Nördhub
        run: python scripts/generate_favicons.py dist
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
